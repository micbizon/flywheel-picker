- decision_id: DEC-002
  date: '2026-04-28'
  ticker: DUOL
  action: HOLD
  current_position_size_pct: 10
  target_position_size_pct: 10
  entry_price: 250.0
  rationale: 'Pytanie o flywheel: TAK — DAU +54% YoY przy AI-content skalującym bez
    liniowego wzrostu COGS, streak mechanics tworzą behawioralny switching cost potwierdzony
    DAU/MAU 30% vs branżowe 15-20%. Teza nie osłabła — flywheel działa. Bear case
    (ChatGPT/Gemini substytucja) jest realny i HIGH-probability, ale nie zmaterializował
    się: paying subscribers nadal rosną, Duolingo Max w fazie wczesnej adopcji. Cena
    -58% od wejścia odzwierciedla re-rating wyceny, nie fundamentalne złamanie tezy.
    Nie uśredniam w dół — teza nie osłabła, ale nie jest wyraźnie silniejsza niż przy
    wejściu. HOLD do potwierdzenia lub falsyfikacji: paying subscribers wzrost <10%
    YoY przez 2 kwartały przy rosnącym DAU = SELL.'
  stop_loss_price: 87.5
  stop_loss_fundamental: Paying subscribers wzrost <10% YoY przez 2 kolejne kwartały
    przy DAU rosnącym >20% (dywergencja = substytucja monetyzacji) LUB DAU/MAU spada
    poniżej 25% przez 2 kolejne kwartały.
  checkin_1yr_criteria: DAU ≥145M w Q4 2025; Paying subscribers wzrost ≥25% YoY; Gross
    margin ≥70%; Duolingo Max penetracja >10% płatnych subskrybentów.
- decision_id: DEC-003
  date: '2026-04-28'
  ticker: HIMS
  action: HOLD
  current_position_size_pct: 10
  target_position_size_pct: 10
  entry_price: 30.0
  rationale: 'Pytanie o flywheel: TAK częściowo — subskrypcja tworzy nawyk, CAC amortyzuje
    się na 2M+ subskrybentów, retencja 80%/12M potwierdzona. Teza nie osłabła strukturalnie
    — ryzyko FDA/GLP-1 było znane przy wejściu i jest wycenione w -58% od ATH. Segment
    non-GLP-1 (~60% bazy) rośnie ~20% YoY, gotówka netto $543M daje runway. Bear case
    (wyrok sądowy Q3 2025) jest HIGH-probability i binarny — to główne ryzyko do monitorowania.
    Nie uśredniam w dół — teza nie osłabła, ale niepewność regulacyjna nie pozwala
    na ADD. HOLD do rozstrzygnięcia wyroku sądowego Q3 2025.'
  stop_loss_price: 13.74
  stop_loss_fundamental: Przegrana w sądzie pierwszej instancji bez zawieszenia wykonania
    LUB FDA enforcement letters powodujące spadek wolumenu recept GLP-1 >30% MoM LUB
    retencja 12-miesięczna spada poniżej 70%.
  checkin_1yr_criteria: Segment non-GLP-1 wzrost ≥15% YoY w Q4 2025; retencja subskrybentów
    ≥75% po 12 miesiącach; gotówka netto ≥$400M; rozstrzygnięcie wyroku sądowego GLP-1.
